<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy group="wmde-greeter">
        <allow send_destination="fun.wmde.Greeter"/>
        <allow receive_sender="fun.wmde.Greeter"/>
    </policy>
    <policy user="root">
        <allow own="fun.wmde.Greeter"/>
        <allow send_destination="fun.wmde.Greeter"/>
        <allow receive_sender="fun.wmde.Greeter"/>
    </policy>
</busconfig>
